[project]
name = "foodrescue"
version = "0.1.0"
description = "FoodRescue AI Coordinator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,adk,api,whatsapp]>=0.8.1",
    "supabase>=2.31.0",
    "psycopg[binary]>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pg8000>=1.31.5",
    "sqlalchemy>=2.0.0",
    "pymongo>=4.6.0",
    "mongomock>=4.1.2",
    "mcp>=1.0.0",
    "pyreadline3; sys_platform == 'win32'",
]



[dependency-groups]
dev = [
    "agentkernel[test]>=0.8.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
