<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCFDFB"/>
      <stop offset="85%" stop-color="#F3F7F2"/>
      <stop offset="100%" stop-color="#E8EFE6"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70B043"/>
      <stop offset="100%" stop-color="#408E2F"/>
    </linearGradient>
    <linearGradient id="heartStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A735"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="handsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#0F281E"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#C1121F"/>
    </linearGradient>
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="250" cy="250" r="238" fill="url(#bgGrad)" stroke="#2D6A4F" stroke-width="8" filter="url(#softShadow)"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="#74C69D" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Top Heart-shaped Vine / Stem -->
  <path d="M250,175 C230,115 145,100 135,170 C125,230 195,290 250,335 C305,290 375,230 365,170 C355,100 270,115 250,175 Z" 
        fill="none" stroke="url(#heartStemGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Vine Leaf -->
  <path d="M345,185 C370,175 395,190 400,215 C375,225 350,210 345,185 Z" fill="url(#leafGrad)" />
  <path d="M345,185 C360,200 375,208 395,212" fill="none" stroke="#2D6A4F" stroke-width="1.5"/>

  <!-- Left Vine Leaf Accent -->
  <path d="M150,195 C125,188 110,205 105,228 C130,233 145,218 150,195 Z" fill="url(#leafGrad)" opacity="0.9" />

  <!-- Inside Box Items (Food & Produce) -->
  <g id="box-contents">
    <!-- Bread Loaf -->
    <path d="M185,175 C180,145 205,130 225,140 C235,145 240,165 235,185 Z" fill="url(#breadGrad)"/>
    <line x1="200" y1="145" x2="208" y2="155" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="215" y1="150" x2="222" y2="160" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Milk Bottle -->
    <rect x="255" y="130" width="30" height="50" rx="6" fill="#EDF6F9" stroke="#CCD5D9" stroke-width="1.5"/>
    <path d="M263,124 L277,124 L275,130 L265,130 Z" fill="#2D6A4F"/>
    <rect x="260" y="145" width="20" height="15" rx="2" fill="#74C69D" opacity="0.5"/>

    <!-- Red Apple -->
    <circle cx="245" cy="165" r="22" fill="url(#appleGrad)"/>
    <circle cx="255" cy="165" r="20" fill="url(#appleGrad)"/>
    <path d="M248,145 C248,138 253,135 258,135" fill="none" stroke="#4A2810" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M255,138 C265,132 270,140 268,144 C260,146 256,142 255,138 Z" fill="#58A735"/>

    <!-- Green Vegetable Leaves -->
    <path d="M275,170 C285,140 315,145 320,165 C320,180 295,190 275,170 Z" fill="url(#leafGrad)"/>
    <path d="M285,165 C295,148 308,152 312,162" fill="none" stroke="#1B4332" stroke-width="1.5"/>

    <!-- Orange / Citrus -->
    <circle cx="215" cy="180" r="14" fill="#F77F00"/>
    <circle cx="265" cy="182" r="15" fill="#F77F00"/>
  </g>

  <!-- Donation Box -->
  <g id="donation-box">
    <!-- Box Body -->
    <polygon points="170,185 330,185 315,275 185,275" fill="url(#boxGrad)" stroke="#1B4332" stroke-width="2"/>
    <!-- Left Flap -->
    <polygon points="150,180 180,185 170,215 140,205" fill="#245841" stroke="#1B4332" stroke-width="1.5"/>
    <!-- Right Flap -->
    <polygon points="350,180 320,185 330,215 360,205" fill="#245841" stroke="#1B4332" stroke-width="1.5"/>
    <!-- Center Heart on Box -->
    <path d="M250,230 C242,218 226,218 222,230 C216,246 250,266 250,266 C250,266 284,246 278,230 C274,218 258,218 250,230 Z" fill="#FFFFFF"/>
  </g>

  <!-- Caring / Supporting Hands -->
  <g id="hands" fill="url(#handsGrad)">
    <!-- Left Hand -->
    <path d="M125,230 C130,215 145,225 150,240 C155,255 170,285 220,310 C240,320 250,335 250,335 C250,335 210,338 185,325 C155,308 135,280 125,255 C120,245 120,235 125,230 Z"/>
    <path d="M148,270 C165,285 195,300 230,312" fill="none" stroke="#2D6A4F" stroke-width="2"/>
    <!-- Left Fingers -->
    <path d="M135,215 C140,205 152,210 155,225 L165,255 C160,260 148,255 142,245 Z"/>
    <path d="M152,235 C156,225 168,230 170,242 L178,268 C172,272 162,268 158,258 Z"/>

    <!-- Right Hand -->
    <path d="M375,230 C370,215 355,225 350,240 C345,255 330,285 280,310 C260,320 250,335 250,335 C250,335 290,338 315,325 C345,308 365,280 375,255 C380,245 380,235 375,230 Z"/>
    <path d="M352,270 C335,285 305,300 270,312" fill="none" stroke="#2D6A4F" stroke-width="2"/>
    <!-- Right Fingers -->
    <path d="M365,215 C360,205 348,210 345,225 L335,255 C340,260 352,255 358,245 Z"/>
    <path d="M348,235 C344,225 332,230 330,242 L322,268 C328,272 338,268 342,258 Z"/>
  </g>

  <!-- Typography: FoodRescue AI -->
  <g id="brand-typography">
    <text x="236" y="385" font-family="'Inter', 'Outfit', system-ui, sans-serif" font-size="44" font-weight="900" fill="#1B4332" text-anchor="middle" letter-spacing="-1">FoodRescue</text>
    <text x="390" y="360" font-family="'Inter', 'Outfit', system-ui, sans-serif" font-size="28" font-weight="900" fill="#E76F51" text-anchor="start">AI</text>
    
    <!-- Slogan Subtitle -->
    <text x="250" y="415" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="700" fill="#2D6A4F" text-anchor="middle" letter-spacing="0.5">Rescuing Food. Feeding Lives.</text>
    
    <!-- Bottom Decorative Sprout Divider -->
    <line x1="165" y1="438" x2="230" y2="438" stroke="#74C69D" stroke-width="2" stroke-linecap="round"/>
    <!-- Center Leaf Sprout -->
    <path d="M250,442 C245,432 238,430 236,432 C236,438 245,441 250,442 Z" fill="#58A735"/>
    <path d="M250,442 C255,432 262,430 264,432 C264,438 255,441 250,442 Z" fill="#58A735"/>
    <circle cx="250" cy="428" r="3" fill="#58A735"/>
    <line x1="270" y1="438" x2="335" y2="438" stroke="#74C69D" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
